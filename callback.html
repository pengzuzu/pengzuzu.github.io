<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla OAuth Callback</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.6}code{word-break:break-all;background:#f2f2f2;padding:2px 6px;border-radius:4px}.box{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}</style>
</head>
<body>
<h1>Tesla OAuth 回调页</h1>
<p>授权完成后会跳到这个页面。请把浏览器地址栏里的完整地址复制下来，发回给 Muse，Muse 会从中提取授权码。授权码只能用一次，请尽快发回，不要把这个地址转发给其他人。</p>
<div class="box">
<p><strong>完整回调地址：</strong></p>
<p><code id="full-url"></code></p>
<p><strong>授权码（code）：</strong></p>
<p><code id="code"></code></p>
<p><strong>状态（state）：</strong></p>
<p><code id="state"></code></p>
<p id="error"></p>
</div>
<script>
var params = new URLSearchParams(window.location.search);
document.getElementById('full-url').textContent = window.location.href;
document.getElementById('code').textContent = params.get('code') || '未找到 code';
document.getElementById('state').textContent = params.get('state') || '未找到 state';
if (params.get('error')) {
  document.getElementById('error').textContent = '授权出错：' + params.get('error');
}
</script>
</body>
</html>
